[versions]
codebase-plugin = "0.0.3"
koog = "1.0.0"

[libraries]
# BOM — source unique de vérité pour toutes les versions
workspace-bom = { module = "education.cccp:workspace-bom", version = "0.0.3" }

# External deps — versions gérées par le BOM (pas de version ici)
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
langchain4j = { module = "dev.langchain4j:langchain4j" }
langchain4j-pgvector = { module = "dev.langchain4j:langchain4j-pgvector" }
langchain4j-minilm = { module = "dev.langchain4j:langchain4j-embeddings-all-minilm-l6-v2" }
langchain4j-ollama = { module = "dev.langchain4j:langchain4j-ollama" }
googleAiGemini = { module = "dev.langchain4j:langchain4j-google-ai-gemini" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-junit5 = { module = "org.testcontainers:junit-jupiter" }
cucumber-java = { module = "io.cucumber:cucumber-java" }
cucumber-junit-platform-engine = { module = "io.cucumber:cucumber-junit-platform-engine" }
cucumber-picocontainer = { module = "io.cucumber:cucumber-picocontainer" }
junit-platform-suite = { module = "org.junit.platform:junit-platform-suite" }
logback-classic = { module = "ch.qos.logback:logback-classic" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core" }
kotlinx-coroutines-reactive = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactive" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql" }
r2dbc-pool = { module = "io.r2dbc:r2dbc-pool" }
r2dbc-spi = { module = "io.r2dbc:r2dbc-spi" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json" }
arrow-core = { module = "io.arrow-kt:arrow-core" }
arrow-fx-coroutines = { module = "io.arrow-kt:arrow-fx-coroutines" }
koog-agents = { module = "ai.koog:koog-agents" }
assertj-core = { module = "org.assertj:assertj-core" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test" }

# Internal education.cccp deps — versions gérées par le BOM
codex-plugin = { module = "education.cccp:codex-plugin" }
planner-plugin = { module = "education.cccp:planner-plugin", version = "0.0.1" }
codebase-contracts = { module = "education.cccp:codebase-contracts" }
agent-contracts = { module = "education.cccp:agent-contracts" }
vibecoding-contracts = { module = "education.cccp:vibecoding-contracts", version = "0.0.1" }
llm-pool-contracts = { module = "education.cccp:llm-pool-contracts" }
opencode-session-contracts = { module = "education.cccp:opencode-session-contracts" }
i18n-contracts = { module = "education.cccp:i18n-contracts" }

[bundles]
cucumber = [
    "cucumber-java",
    "cucumber-junit-platform-engine",
    "cucumber-picocontainer",
    "junit-platform-suite",
]
langchain4j-rag = [
    "langchain4j",
    "langchain4j-pgvector",
    "langchain4j-minilm",
    "langchain4j-ollama",
]
r2dbc = [
    "r2dbc-postgresql",
    "r2dbc-pool",
    "r2dbc-spi",
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-reactive",
]
arrow = [
    "arrow-core",
    "arrow-fx-coroutines",
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.3.20" }
publish = { id = "com.gradle.plugin-publish", version = "2.1.0" }
codebase = { id = "education.cccp.codebase", version.ref = "codebase-plugin" }