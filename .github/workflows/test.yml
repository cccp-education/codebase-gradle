name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  fast-tests:
    name: Fast Tests (PR Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: codebase-plugin

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Run fast tests (JUnit5 + quick Cucumber)
        run: ./gradlew testFast -x build
        env:
          CI: "true"

  # ── unit tests (JUnit only, no Ollama) ──────────────────────────────────────────
  # `test` is JUnit-only (build.gradle.kts: `includeEngines("junit-jupiter")`) and
  # excludes the `ollama` tag: the handful of unit tests that probe a real Ollama
  # instance (`@Tag("ollama")`) run in the dedicated `unit-ollama` job below. So this
  # job pays no Docker image / model setup — only the fast JUnit suite (Docker stays
  # available on the runner for the pgvector-backed JUnit tests, pulled on demand).
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    # Started immediately, without the fast PR gate as a prerequisite: the heavy
    # jobs run in parallel with it on a main push. Tradeoff: a broken main push
    # runs every job instead of stopping after the PR gate. The PR gate itself is
    # unchanged (only the fast job runs on pull_request), and `publish` still
    # needs every job. Locked by `codebase.ci.CodebaseCiOllamaDecouplingTest`.
    defaults:
      run:
        working-directory: codebase-plugin

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Run unit tests
        run: ./gradlew test
        env:
          CI: "true"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-unit
          path: codebase-plugin/build/reports/

  # ── Ollama-dependent unit tests (dedicated native Ollama setup) ────────────────
  # Only the `@Tag("ollama")` JUnit tests need a live Ollama instance. Isolating
  # them here keeps that setup cost off the bulk `unit` job, without losing any
  # coverage. Ollama is installed natively (no Docker image); the tagged tests
  # stay `assumeTrue(isOllamaReady)`-guarded, so they skip cleanly outside CI.
  unit-ollama:
    name: Unit Tests (Ollama)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    # Started immediately in parallel with the fast PR gate (see `unit`).
    defaults:
      run:
        working-directory: codebase-plugin

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      # Ollama runs natively (official install script) instead of inside a
      # Docker container. The Docker route dominated the critical path: the
      # `docker save` tarball cache cost ~53 s restore + ~82 s `docker load`,
      # and a direct pull from Docker Hub cost ~117 s (anonymous throttling on
      # the shared runner IP). The native install is a single stream from the
      # GitHub release CDN into /usr/local — no image layer extraction
      # (measured in session 280).
      - name: Install Ollama (native)
        env:
          OLLAMA_VERSION: "0.40.4"
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache Ollama models
        id: ollama-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ollama-ci-11466
            ~/.ollama-ci-11467
          key: ollama-models-qwen3-0.6b-native-v1

      # Two instances on the CI ports (11466-11467, outside the rotation range),
      # each backed by its own model store so the model cache round-trips.
      - name: Start Ollama instances on CI ports 11466-11467
        run: |
          for port in 11466 11467; do
            mkdir -p ~/.ollama-ci-$port/models
            OLLAMA_HOST=0.0.0.0:$port OLLAMA_MODELS=$HOME/.ollama-ci-$port/models \
              nohup ollama serve >/tmp/ollama-$port.log 2>&1 &
          done

      # Fail loudly if a server never comes up: otherwise the `@Tag("ollama")`
      # tests would silently skip (their `assumeTrue` guard) and report green
      # with zero coverage.
      - name: Wait for Ollama readiness
        run: |
          for port in 11466 11467; do
            ready=""
            for i in $(seq 1 60); do
              if curl -s http://localhost:$port/api/version >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ -z "$ready" ]; then
              echo "Ollama not ready on port $port"
              cat /tmp/ollama-$port.log || true
              exit 1
            fi
            echo "Ollama ready on port $port"
          done

      - name: Pull lightweight model on each instance
        if: steps.ollama-cache.outputs.cache-hit != 'true'
        run: |
          for port in 11466 11467; do
            OLLAMA_HOST=127.0.0.1:$port ollama pull qwen3:0.6b
          done

      - name: Run Ollama-dependent unit tests
        run: ./gradlew unitOllama
        env:
          CI: "true"
          OLLAMA_TEST_PORT: "11466"
          OLLAMA_TEST_MODEL: "qwen3:0.6b"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-unit-ollama
          path: codebase-plugin/build/reports/

  # ── BDD shards (parallel machines) ─────────────────────────────────────────────
  # The monolithic `testAll` BDD run is split into EXHAUSTIVE, DISJOINT feature
  # shards, each on its own runner, in a single JVM (keeps the aggregate's
  # efficiency). Guarded by `codebase.ci.CodebaseCucumberShardCoverageTest`.
  #
  # No shard needs the Ollama container (only the `unit-ollama` job does).
  # pgvector-backed scenarios use testcontainers, which pull `pgvector/pgvector:pg17` on demand
  # (Docker is preinstalled on ubuntu-latest) — exactly as the previous monolithic
  # `full-tests` job did.
  bdd-shard:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    # Started immediately in parallel with the fast PR gate (see `unit`).
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "BDD · epic9"
            task: cucumberTestShardEpic9
          - name: "BDD · governance"
            task: cucumberTestShardGovernance
          - name: "BDD · vibecoding"
            task: cucumberTestShardVibecoding
          - name: "BDD · session-protocol"
            task: cucumberTestShardSessionProtocol
          - name: "BDD · agentic"
            task: cucumberTestShardAgentic
          - name: "BDD · ocr-rag"
            task: cucumberTestShardOcrRag
          - name: "BDD · core-misc"
            task: cucumberTestShardCoreMisc
    defaults:
      run:
        working-directory: codebase-plugin

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Run BDD shard
        run: ./gradlew ${{ matrix.task }}
        env:
          CI: "true"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.task }}
          path: codebase-plugin/build/reports/

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fast-tests, unit, unit-ollama, bdd-shard]
    defaults:
      run:
        working-directory: codebase-plugin

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish to Maven Central
        run: ./gradlew publishAggregationToCentralPortal --no-daemon
        env:
          CI: "true"
