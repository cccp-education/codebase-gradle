name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  fast-tests:
    name: Fast Tests (PR Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: gradle

      - name: Run fast tests (JUnit5 + quick Cucumber)
        run: ./gradlew testFast -x build
        env:
          CI: "true"

  full-tests:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [fast-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Docker image ollama/ollama:0.20.2
        id: docker-image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/ollama-image.tar
          key: docker-ollama-0.20.2-v1

      - name: Load Docker image from cache
        if: steps.docker-image-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/ollama-image.tar

      - name: Pull Docker image if not cached
        if: steps.docker-image-cache.outputs.cache-hit != 'true'
        run: |
          docker pull ollama/ollama:0.20.2
          docker save ollama/ollama:0.20.2 -o /tmp/ollama-image.tar

      - name: Cache Ollama models
        id: ollama-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ollama-ci-11466
            ~/.ollama-ci-11467
          key: ollama-models-qwen3-0.6b-v1

      - name: Start Ollama instances on CI ports 11466-11467
        run: |
          mkdir -p ~/.ollama-ci-11466 ~/.ollama-ci-11467
          for port in 11466 11467; do
            docker run -d \
              --name ollama-ci-$port \
              --restart always \
              -p $port:11434 \
              -v ~/.ollama-ci-$port:/root/.ollama \
              -e OLLAMA_HOST=0.0.0.0 \
              ollama/ollama:0.20.2
          done

      - name: Wait for Ollama readiness
        run: |
          for port in 11466 11467; do
            for i in $(seq 1 60); do
              if curl -s http://localhost:$port/api/version >/dev/null 2>&1; then
                echo "Ollama ready on port $port"
                break
              fi
              sleep 1
            done
          done

      - name: Pull lightweight model on each instance
        if: steps.ollama-cache.outputs.cache-hit != 'true'
        run: |
          for port in 11466 11467; do
            docker exec ollama-ci-$port ollama pull qwen3:0.6b
          done

      - name: Run all tests
        run: ./gradlew testAll
        env:
          CI: "true"
          OLLAMA_TEST_PORT: "11466"
          OLLAMA_TEST_MODEL: "qwen3:0.6b"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: codebase-plugin/build/reports/

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fast-tests, full-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish to Maven Central
        run: ./gradlew publishAggregationToCentralPortal --no-daemon
        env:
          CI: "true"