name: Ingest Governance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ingest:
    name: Governance Ingest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ingest Governance
        run: ./gradlew :codebase-plugin:ingestGovernance \
          -Pcodebase.governance.incremental=true \
          -Pcodebase.governance.chunkIncremental=true \
          -Pcodebase.governance.strictValidation=true
